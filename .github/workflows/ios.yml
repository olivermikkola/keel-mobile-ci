name: XR small-model proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Pinned runtime and ${{ matrix.name }} ${{ matrix.kv }}
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qwen3 0.6B
            kv: f16
            repo: Qwen/Qwen3-0.6B-GGUF
            revision: 23749fefcc72300e3a2ad315e1317431b06b590a
            filename: Qwen3-0.6B-Q8_0.gguf
            sha256: 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
          - name: Qwen3 0.6B
            kv: q8_0
            repo: Qwen/Qwen3-0.6B-GGUF
            revision: 23749fefcc72300e3a2ad315e1317431b06b590a
            filename: Qwen3-0.6B-Q8_0.gguf
            sha256: 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
          - name: Bonsai 2 2B
            kv: f16
            repo: prism-ml/Ternary-Bonsai-2-2B-gguf
            revision: a6032a5089ac27e96be3a80c7b42d1ad0bd89887
            filename: Ternary-Bonsai-2-2B-Q2_0.gguf
            sha256: c2893fa6f951daee8b7263d5f49b455e57989ef56417a22125b03566dc560650
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime headers
        run: apt-get update && apt-get install -y --no-install-recommends curl libsqlite3-dev libgomp1
      - name: Download the same llama.cpp revision as Keel and verify model weights
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          REVISION: ${{ matrix.revision }}
          FILENAME: ${{ matrix.filename }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p proof/runtime proof/results
          curl --fail --location --retry 3 --silent --show-error https://github.com/ggml-org/llama.cpp/releases/download/b12367/llama-b12367-bin-ubuntu-x64.tar.gz | tar -xz -C proof/runtime
          curl --fail --location --retry 3 --silent --show-error "https://huggingface.co/$REPO/resolve/$REVISION/$FILENAME" --output "proof/$FILENAME"
          printf '%s  %s\n' "$SHA256" "proof/$FILENAME" | sha256sum -c -
      - name: Exercise simple chat and file tasks with the app harness
        shell: bash
        env:
          FILENAME: ${{ matrix.filename }}
          KV: ${{ matrix.kv }}
        run: |
          set -euo pipefail
          runtime="$(find proof/runtime -type f -name llama-server -print -quit)"
          export LD_LIBRARY_PATH="$(dirname "$runtime"):${LD_LIBRARY_PATH:-}"
          "$runtime" --version
          "$runtime" -m "proof/$FILENAME" --host 127.0.0.1 --port 8081 -c 4096 -ctk "$KV" -ctv "$KV" -fa on -ngl 0 -t 2 -tb 2 -np 1 >proof/results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/health
          bash tools/harness-eval/agent.sh --server http://127.0.0.1:8081 --context 4096 --family bonsai --kind local --samples 1 --task-file proof/tasks.json --grammar --out proof/results/attempts.jsonl | tee proof/results/summary.txt
      - name: Record actual successes, tool usage and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}-${{ matrix.kv }}-evidence
          path: proof/results
          if-no-files-found: warn
