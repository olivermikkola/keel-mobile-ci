name: KeelMobile
options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  # MLX as a second runtime for the runtime benchmark only (Settings → Runtime benchmark).
  # Pinned to the commit that added LFM3 (ml-explore/mlx-swift-lm#750); keep in sync with tools/mlx-probe.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 6352907543270ae9c61fcaf59cb3e07b0b989ea1
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.4.0
  # Kokoro narration voice for short videos (Core ML). Apache-2.0. Keep in sync
  # with NarrationVoicePack.fluidAudioVersion.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.4
  # Apple's Core ML Stable Diffusion parts, copied in (see its README for why).
  StableDiffusionCore:
    path: Vendor/StableDiffusionCore
targets:
  KeelMobile:
    type: application
    platform: iOS
    info:
      path: build/KeelMobile-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Keel uses the microphone when you dictate or talk with it. Speech is recognised on your device.
        NSCameraUsageDescription: Keel uses the camera when you choose to take a photo for a chat.
        NSPhotoLibraryAddUsageDescription: Keel saves videos and carousel images to your Photos only when you tap Save.
        NSSpeechRecognitionUsageDescription: Keel turns speech into message text on your device using offline recognition.
        NSCalendarsFullAccessUsageDescription: Keel reads upcoming events and adds calendar events you explicitly approve on this device.
        NSRemindersFullAccessUsageDescription: Keel reads incomplete reminders and creates reminders you explicitly approve on this device.
        NSLocalNetworkUsageDescription: Keel connects only to a gateway address you enter. Repository reads use github.com.
        # iOS 26 lets a download or a reply the user started finish after they
        # leave the app. Each job's identifier is a prefix plus its own ending.
        BGTaskSchedulerPermittedIdentifiers:
          - com.olivermikkola.keelmobile.transfer.*
          - com.olivermikkola.keelmobile.reply.*
          - com.olivermikkola.keelmobile.media.*
        UIBackgroundModes: [processing]
        CFBundleURLTypes:
          - CFBundleURLName: com.olivermikkola.keelmobile.github
            CFBundleURLSchemes: [keelmobile]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text, Data, and Documents
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.comma-separated-values-text
              - public.json
              - com.adobe.pdf
              - public.source-code
    # Harness/ is the KeelHarness package (docs/HARNESS.md), compiled into the app.
    sources:
      - Sources
      # KeelShell.js is the shell tool's bundle (tools/keel-shell). Listed on its
      # own so Xcode copies it as a resource instead of treating it as source.
      - path: Resources
        excludes: [KeelShell.js]
      - path: Resources/KeelShell.js
        buildPhase: resources
      - Harness
    dependencies:
      - framework: build/runtime/build-apple/llama.xcframework
        embed: true
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: StableDiffusionCore
      - package: FluidAudio
        product: FluidAudio
      # "Send to Keel" in other apps' share sheets.
      - target: KeelShare
    postBuildScripts:
      # FluidAudio's TTS links a LuxTTS lexicon derived from espeak-ng (GPL-3.0;
      # see its ThirdPartyLicenses/LuxTtsEnglishG2P-LICENSE.md). Keel uses only
      # Kokoro, which never reads it, so the bundle is removed before signing.
      # NarrationVoiceTests fails if it ever ships.
      - name: Remove unused GPL-derived LuxTTS data
        basedOnDependencyAnalysis: false
        script: |
          rm -rf "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/FluidAudio_LuxTtsG2pResources.bundle"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivermikkola.keelmobile
        # The App Group the share extension saves into (SharedInbox).
        CODE_SIGN_ENTITLEMENTS: KeelMobile.entitlements
        # Simulator builds have no provisioning profile to supply this identity.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keel Mobile
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  KeelShare:
    type: app-extension
    platform: iOS
    info:
      path: build/KeelShare-Info.plist
      properties:
        CFBundleDisplayName: Keel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsFileWithMaxCount: 1
    sources:
      - path: ShareExtension
        excludes: ["*.entitlements"]
      - path: Harness/SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivermikkola.keelmobile.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/KeelShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keel
        SKIP_INSTALL: YES
  KeelMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The harness tests also run on Linux with `swift test`; here they run
      # against the phone SDK's own SQLite.
      - path: HarnessTests
      - path: UITests/Fixtures/github-recording.json
        buildPhase: resources
      - path: build/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: KeelMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivermikkola.keelmobile.tests
        GENERATE_INFOPLIST_FILE: YES
  KeelMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: KeelMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivermikkola.keelmobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KeelMobile:
    build:
      targets:
        KeelMobile: all
    test:
      targets: [KeelMobileTests, KeelMobileUITests]
